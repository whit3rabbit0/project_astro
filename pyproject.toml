[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-astro"
version = "2.0.0"
description = "Intelligence layer for LLM-driven penetration testing — structured output, CVE correlation, scope enforcement, multi-LLM support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0",
    "python-libnmap>=0.7.3",
    "pydantic>=2.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "ollama>=0.4.8",
    "aiosqlite>=0.20.0",
    "click>=8.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "psutil>=6.1.1",
    "openai>=1.0",
    "networkx>=3.0",
    "textual>=0.80.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
reporting = [
    "jinja2>=3.1",
]

[project.scripts]
astro = "astro.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
